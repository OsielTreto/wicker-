<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wicker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #12100e;
      color: #c4b8a4;
      user-select: none;
      transition: background 0.8s ease;
    }
    body.on { background: #1a1612; }
    .wrap {
      width: min(420px, calc(100% - 3rem));
      text-align: center;
    }
    .lamp {
      width: 8px;
      height: 8px;
      margin: 0 auto 1.8rem;
      border-radius: 50%;
      background: #3a3428;
      cursor: pointer;
      transition: background 0.6s ease, box-shadow 0.8s ease;
    }
    body.on .lamp {
      background: #e8c07a;
      box-shadow: 0 0 18px 6px rgba(232, 192, 122, 0.35);
    }
    .time {
      font-size: clamp(3rem, 9vw, 5.2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: #8a7f70;
      transition: color 0.6s ease;
    }
    body.on .time { color: #d9cbb8; }
    .date {
      margin-top: 0.45rem;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      color: #5a5248;
    }
    .name {
      margin-top: 1.1rem;
      font-size: 0.68rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #4a443c;
      cursor: pointer;
    }
    .name:hover { color: #6a5e4c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="lamp" id="lamp" title="Wicker"></div>
    <div class="time" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="name" id="wickerToggle">Wicker</div>
  </div>

  <script>
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');

    let wakeLock = null;
    let active = false;
    let fallbackTimer = null;

    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString('es-MX', {
        hour12: false, hour: '2-digit', minute: '2-digit'
      });
      dateEl.textContent = now.toLocaleDateString('es-MX', {
        weekday: 'short', day: 'numeric', month: 'short'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setOn(on) {
      document.body.classList.toggle('on', on);
    }

    function startFallback() {
      stopFallback();
      fallbackTimer = setInterval(() => { document.title = 'Wicker'; }, 30000);
    }

    function stopFallback() {
      if (fallbackTimer) {
        clearInterval(fallbackTimer);
        fallbackTimer = null;
      }
    }

    async function requestLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          if (active) setOn(false);
        });
      } catch (_) {}
    }

    async function activate() {
      active = true;
      startFallback();
      await requestLock();
      setOn(true);
    }

    async function deactivate() {
      active = false;
      stopFallback();
      if (wakeLock) {
        try { await wakeLock.release(); } catch (_) {}
        wakeLock = null;
      }
      setOn(false);
    }

    function toggleWicker() {
      if (active) deactivate();
      else activate();
    }

    document.addEventListener('click', toggleWicker);

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && active && !wakeLock) {
        await requestLock();
        setOn(true);
      }
    });
  </script>
</body>
</html>
