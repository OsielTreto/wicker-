<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wicker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #12100e;
      color: #c4b8a4;
      user-select: none;
      transition: background 0.8s ease;
    }
    body.on { background: #1a1612; }
    .wrap {
      width: min(420px, calc(100% - 3rem));
      text-align: center;
    }
    .lamp {
      width: 8px;
      height: 8px;
      margin: 0 auto 1.8rem;
      border-radius: 50%;
      background: #3a3428;
      cursor: pointer;
      transition: background 0.6s ease, box-shadow 0.8s ease;
    }
    body.on .lamp {
      background: #e8c07a;
      box-shadow: 0 0 18px 6px rgba(232, 192, 122, 0.35);
    }
    .time {
      font-size: clamp(3rem, 9vw, 5.2rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      color: #8a7f70;
      transition: color 0.6s ease;
    }
    body.on .time { color: #d9cbb8; }
    .date {
      margin-top: 0.45rem;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      color: #5a5248;
    }
    .name {
      margin-top: 1.1rem;
      font-size: 0.68rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #4a443c;
      cursor: pointer;
    }
    .name:hover { color: #6a5e4c; }
    .agenda {
      margin-top: 2.4rem;
      text-align: left;
    }
    .day {
      margin-bottom: 1.35rem;
    }
    .day-label {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: #5c5348;
      margin-bottom: 0.55rem;
    }
    .event {
      display: grid;
      grid-template-columns: 3.4rem 1fr;
      gap: 0.85rem;
      padding: 0.28rem 0;
      align-items: baseline;
    }
    .event.now .summary { color: #e8c07a; }
    .when {
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      color: #6a6256;
      font-variant-numeric: tabular-nums;
    }
    .summary {
      font-size: 0.95rem;
      color: #b7ab98;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    dialog {
      border: none;
      border-radius: 14px;
      padding: 1.4rem 1.3rem 1.2rem;
      width: min(380px, calc(100% - 2rem));
      background: #1c1914;
      color: #c4b8a4;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    dialog h2 {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #8a7f70;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      color: #6a6256;
      margin-bottom: 0.4rem;
    }
    input[type="url"], input[type="text"], input[type="datetime-local"] {
      width: 100%;
      margin-bottom: 0.85rem;
      padding: 0.55rem 0.7rem;
      border: 1px solid #3a3428;
      border-radius: 8px;
      background: #12100e;
      color: #d9cbb8;
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
    }
    .hint, .err {
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      line-height: 1.45;
      color: #6a6256;
      margin-bottom: 1rem;
    }
    .err { color: #c47a6a; }
    .actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
    button {
      font-family: system-ui, sans-serif;
      font-size: 0.8rem;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .save { background: #e8c07a; color: #1a1612; }
    .ghost { background: transparent; color: #8a7f70; }
    .add-row { display: grid; grid-template-columns: 1fr auto; gap: 0.45rem; align-items: start; }
    .add-row input { margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="lamp" id="lamp" title="Wicker"></div>
    <div class="time" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="name" id="openSettings">Wicker</div>
    <div class="agenda" id="agenda"></div>
  </div>

  <dialog id="settings">
    <h2>Calendario</h2>
    <label for="icsUrl">Enlace iCal</label>
    <input id="icsUrl" type="url" placeholder="https://…/basic.ics" autocomplete="off">
    <p class="hint">
      Google Calendar: Configuración del calendario → Integrar → dirección secreta en iCal.
      Outlook: Compartir → Publicar calendario.
    </p>
    <p class="err" id="calError" hidden></p>
    <label>Añadir a mano</label>
    <div class="add-row">
      <input id="localTitle" type="text" placeholder="Título">
      <button type="button" class="ghost" id="addLocal">Añadir</button>
    </div>
    <input id="localWhen" type="datetime-local" style="margin-top: 0.45rem">
    <div class="actions">
      <button type="button" class="ghost" id="closeSettings">Cerrar</button>
      <button type="button" class="save" id="saveSettings">Guardar</button>
    </div>
  </dialog>

  <script>
    const KEY_ICS = 'wicker.icsUrl';
    const KEY_LOCAL = 'wicker.localEvents';
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    const agendaEl = document.getElementById('agenda');
    const settings = document.getElementById('settings');
    const icsUrlEl = document.getElementById('icsUrl');
    const calError = document.getElementById('calError');

    let wakeLock = null;
    let active = false;
    let fallbackTimer = null;
    let icsEvents = [];

    function pad(n) { return String(n).padStart(2, '0'); }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updateClock() {
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString('es-MX', {
        hour12: false, hour: '2-digit', minute: '2-digit'
      });
      dateEl.textContent = now.toLocaleDateString('es-MX', {
        weekday: 'short', day: 'numeric', month: 'short'
      });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function setOn(on) {
      document.body.classList.toggle('on', on);
    }

    function startFallback() {
      stopFallback();
      fallbackTimer = setInterval(() => { document.title = 'Wicker'; }, 30000);
    }

    function stopFallback() {
      if (fallbackTimer) {
        clearInterval(fallbackTimer);
        fallbackTimer = null;
      }
    }

    async function requestLock() {
      if (!('wakeLock' in navigator)) return;
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          if (active) setOn(false);
        });
      } catch (_) {}
    }

    async function activate() {
      active = true;
      startFallback();
      await requestLock();
      setOn(true);
    }

    async function deactivate() {
      active = false;
      stopFallback();
      if (wakeLock) {
        try { await wakeLock.release(); } catch (_) {}
        wakeLock = null;
      }
      setOn(false);
    }

    document.getElementById('lamp').addEventListener('click', (e) => {
      e.stopPropagation();
      if (active) deactivate();
      else activate();
    });

    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && active && !wakeLock) {
        await requestLock();
        setOn(true);
      }
    });

    function unescapeIcal(value) {
      return value
        .replace(/\\n/gi, ' ')
        .replace(/\\,/g, ',')
        .replace(/\\;/g, ';')
        .replace(/\\\\/g, '\\');
    }

    function unfoldIcs(text) {
      return text.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '');
    }

    function parseIcalDate(params, value) {
      const raw = value.trim();
      const allDay = /VALUE=DATE/i.test(params) || /^\d{8}$/.test(raw);
      const digits = raw.replace(/[^0-9TZ]/g, '');
      const y = +digits.slice(0, 4);
      const m = +digits.slice(4, 6) - 1;
      const d = +digits.slice(6, 8);
      if (allDay) return { date: new Date(y, m, d), allDay: true };
      const h = +digits.slice(9, 11) || 0;
      const mi = +digits.slice(11, 13) || 0;
      const s = +digits.slice(13, 15) || 0;
      if (/Z$/i.test(raw)) return { date: new Date(Date.UTC(y, m, d, h, mi, s)), allDay: false };
      return { date: new Date(y, m, d, h, mi, s), allDay: false };
    }

    function parseRrule(value) {
      const r = {};
      value.split(';').forEach((part) => {
        const [k, v] = part.split('=');
        if (!k || !v) return;
        const key = k.toUpperCase();
        if (key === 'FREQ') r.freq = v.toUpperCase();
        if (key === 'INTERVAL') r.interval = +v || 1;
        if (key === 'BYDAY') r.byday = v.split(',');
        if (key === 'UNTIL') r.until = parseIcalDate('', v).date;
        if (key === 'COUNT') r.count = +v;
      });
      r.interval = r.interval || 1;
      return r;
    }

    const BYDAY = { SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 };

    function parseIcs(text) {
      const blocks = unfoldIcs(text).split(/BEGIN:VEVENT/i);
      const events = [];
      for (const block of blocks.slice(1)) {
        const body = block.split(/END:VEVENT/i)[0];
        const field = (name) => {
          const re = new RegExp('^(' + name + '[^:\\n]*):(.*)$', 'mi');
          const m = body.match(re);
          return m ? { params: m[1], value: unescapeIcal(m[2].trim()) } : null;
        };
        const startLine = field('DTSTART');
        if (!startLine) continue;
        const start = parseIcalDate(startLine.params, startLine.value);
        const endLine = field('DTEND');
        const end = endLine ? parseIcalDate(endLine.params, endLine.value) : null;
        const summary = field('SUMMARY');
        const rrule = field('RRULE');
        events.push({
          summary: (summary && summary.value) || 'Evento',
          start: start.date,
          end: end ? end.date : null,
          allDay: start.allDay,
          rrule: rrule ? parseRrule(rrule.value) : null
        });
      }
      return events;
    }

    function addDays(date, n) {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    }

    function expandEvent(ev, from, to) {
      const duration = ev.end ? ev.end.getTime() - ev.start.getTime() : 0;
      const hits = [];
      const push = (start) => {
        if (start >= to) return;
        const end = duration ? new Date(start.getTime() + duration) : null;
        if (end ? end > from : start >= from || (ev.allDay && start.toDateString() === from.toDateString())) {
          if (end ? end > from && start < to : start >= from && start < to) {
            hits.push({ summary: ev.summary, start, end, allDay: ev.allDay });
          }
        }
      };

      if (!ev.rrule || !ev.rrule.freq) {
        push(new Date(ev.start));
        return hits;
      }

      const { freq, interval, byday, until, count } = ev.rrule;
      let cursor = new Date(ev.start);
      let n = 0;
      let guard = 0;
      while (cursor < to && guard++ < 500 && (!count || n < count + 30)) {
        if (until && cursor > until) break;
        const dayOk = !byday || byday.some((code) => BYDAY[code] === cursor.getDay());
        if (dayOk) {
          if (!count || n < count) push(new Date(cursor));
          n++;
        }
        if (freq === 'DAILY') cursor = addDays(cursor, interval);
        else if (freq === 'WEEKLY' && byday) cursor = addDays(cursor, 1);
        else if (freq === 'WEEKLY') cursor = addDays(cursor, 7 * interval);
        else if (freq === 'MONTHLY') {
          cursor = new Date(cursor);
          cursor.setMonth(cursor.getMonth() + interval);
        } else break;
      }
      return hits;
    }

    function localEvents() {
      try { return JSON.parse(localStorage.getItem(KEY_LOCAL) || '[]'); }
      catch { return []; }
    }

    function saveLocal(events) {
      localStorage.setItem(KEY_LOCAL, JSON.stringify(events));
    }

    function upcoming() {
      const now = new Date();
      const to = addDays(now, 10);
      const fromIcs = icsEvents.flatMap((ev) => expandEvent(ev, now, to));
      const fromLocal = localEvents()
        .map((ev) => ({
          summary: ev.summary,
          start: new Date(ev.start),
          end: null,
          allDay: false
        }))
        .filter((ev) => ev.start >= now && ev.start < to);
      return fromIcs.concat(fromLocal)
        .sort((a, b) => a.start - b.start)
        .slice(0, 8);
    }

    function dayKey(date) {
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
    }

    function formatDay(date) {
      const today = new Date();
      if (dayKey(date) === dayKey(today)) return 'hoy';
      if (dayKey(date) === dayKey(addDays(today, 1))) return 'mañana';
      return date.toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function isNow(ev) {
      const now = Date.now();
      const start = ev.start.getTime();
      const end = ev.end ? ev.end.getTime() : start + 45 * 60 * 1000;
      return start <= now && now < end;
    }

    function renderAgenda() {
      const items = upcoming();
      if (!items.length) {
        agendaEl.innerHTML = '';
        return;
      }
      const groups = [];
      for (const ev of items) {
        const key = dayKey(ev.start);
        if (!groups.length || groups[groups.length - 1].key !== key) {
          groups.push({ key, date: ev.start, events: [] });
        }
        groups[groups.length - 1].events.push(ev);
      }
      agendaEl.innerHTML = groups.map((g) => `
        <div class="day">
          <div class="day-label">${formatDay(g.date)}</div>
          ${g.events.map((ev) => `
            <div class="event${isNow(ev) ? ' now' : ''}">
              <div class="when">${ev.allDay ? 'todo el día' : pad(ev.start.getHours()) + ':' + pad(ev.start.getMinutes())}</div>
              <div class="summary">${escapeHtml(ev.summary)}</div>
            </div>
          `).join('')}
        </div>
      `).join('');
    }

    async function fetchIcs(url) {
      const attempts = [
        url,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)
      ];
      let lastErr = null;
      for (const u of attempts) {
        try {
          const res = await fetch(u);
          if (res.ok) return await res.text();
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('No se pudo leer el calendario');
    }

    async function refreshCalendar() {
      const url = (localStorage.getItem(KEY_ICS) || '').trim();
      calError.hidden = true;
      if (url) {
        try {
          icsEvents = parseIcs(await fetchIcs(url));
        } catch (_) {
          icsEvents = [];
          calError.hidden = false;
          calError.textContent = 'No se pudo leer el iCal. El enlace queda guardado; prueba de nuevo más tarde.';
        }
      } else {
        icsEvents = [];
      }
      renderAgenda();
    }

    document.getElementById('openSettings').addEventListener('click', () => {
      icsUrlEl.value = localStorage.getItem(KEY_ICS) || '';
      settings.showModal();
    });

    document.getElementById('closeSettings').addEventListener('click', () => settings.close());

    document.getElementById('saveSettings').addEventListener('click', async () => {
      localStorage.setItem(KEY_ICS, icsUrlEl.value.trim());
      await refreshCalendar();
      if (calError.hidden) settings.close();
    });

    document.getElementById('addLocal').addEventListener('click', () => {
      const summary = document.getElementById('localTitle').value.trim();
      const when = document.getElementById('localWhen').value;
      if (!summary || !when) return;
      const events = localEvents();
      events.push({ summary, start: new Date(when).toISOString() });
      saveLocal(events);
      document.getElementById('localTitle').value = '';
      renderAgenda();
    });

    refreshCalendar();
    setInterval(refreshCalendar, 10 * 60 * 1000);
    setInterval(renderAgenda, 60 * 1000);
  </script>
</body>
</html>
